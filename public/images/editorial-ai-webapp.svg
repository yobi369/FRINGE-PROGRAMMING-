<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="pipeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)"/>
  
  <g transform="translate(100, 100)">
    <!-- Browser Client Frame -->
    <rect x="0" y="20" width="160" height="180" rx="8" fill="#131B2E" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="20" width="160" height="26" rx="8" fill="#1E293B"/>
    <circle cx="15" cy="33" r="4" fill="#EF4444"/>
    <circle cx="28" cy="33" r="4" fill="#F59E0B"/>
    <circle cx="41" cy="33" r="4" fill="#10B981"/>
    <text x="80" y="80" fill="#38BDF8" font-family="sans-serif" font-weight="600" font-size="12" text-anchor="middle">REACT CLIENT</text>
    <text x="80" y="110" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">STREAMING SSE</text>
    <text x="80" y="130" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">ZOD PARSER</text>

    <!-- Stream Pipe -->
    <path d="M 160,110 L 250,110" stroke="url(#pipeGlow)" stroke-width="3" stroke-dasharray="8,4"/>

    <!-- Edge Gateway / API Proxy -->
    <rect x="250" y="35" width="140" height="150" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
    <text x="320" y="75" fill="#E2E8F0" font-family="sans-serif" font-weight="600" font-size="12" text-anchor="middle">EDGE PROXY</text>
    <text x="320" y="105" fill="#A78BFA" font-family="monospace" font-size="10" text-anchor="middle">RATE LIMITER</text>
    <text x="320" y="125" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="middle">SECRET SHIELD</text>
    <text x="320" y="145" fill="#64748B" font-family="monospace" font-size="10" text-anchor="middle">KV CACHE</text>

    <!-- LLM Pipe -->
    <path d="M 390,110 L 470,110" stroke="url(#pipeGlow)" stroke-width="3" stroke-dasharray="8,4"/>

    <!-- Foundation Inference Core -->
    <rect x="470" y="20" width="160" height="180" rx="8" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <text x="550" y="80" fill="#C084FC" font-family="sans-serif" font-weight="700" font-size="13" text-anchor="middle">LLM BACKEND</text>
    <text x="550" y="110" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">SCHEMA JSON</text>
    <text x="550" y="130" fill="#06B6D4" font-family="monospace" font-size="10" text-anchor="middle">&lt;350ms TTFT</text>
  </g>
  <text x="700" y="420" fill="#475569" font-family="monospace" font-size="10" text-anchor="end">FULL-STACK AI TOPOLOGY</text>
</svg>
