<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
  </g>

  <!-- RLHF Neural Nodes & Human Alignment Pathway -->
  <g transform="translate(140, 100)">
    <!-- Connections -->
    <path d="M 60,110 L 190,60 L 320,110 L 450,50 L 520,130" stroke="#334155" stroke-width="2" fill="none"/>
    <path d="M 60,110 L 190,170 L 320,110 L 450,190 L 520,130" stroke="#334155" stroke-width="2" fill="none"/>
    <path d="M 190,60 L 320,190" stroke="url(#cyanGlow)" stroke-width="2" stroke-dasharray="6,4" fill="none"/>
    
    <!-- Model Node 1 -->
    <circle cx="60" cy="110" r="28" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
    <text x="60" y="115" fill="#E2E8F0" font-family="monospace" font-size="12" text-anchor="middle">INPUT</text>

    <!-- Intermediate Nodes -->
    <circle cx="190" cy="60" r="22" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
    <circle cx="190" cy="170" r="22" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
    
    <!-- Human Evaluation Calibration Node (Center Highlight) -->
    <rect x="270" y="70" width="100" height="80" rx="8" fill="#131B2E" stroke="#8B5CF6" stroke-width="2"/>
    <text x="320" y="102" fill="#A78BFA" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">RLHF REWARD</text>
    <text x="320" y="122" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">ALIGNMENT</text>
    <circle cx="320" cy="138" r="4" fill="#06B6D4"/>

    <!-- Downstream Inference -->
    <circle cx="450" cy="50" r="20" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
    <circle cx="450" cy="190" r="20" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>

    <!-- Final Output Gate -->
    <circle cx="520" cy="130" r="32" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
    <text x="520" y="135" fill="#E2E8F0" font-family="monospace" font-size="11" text-anchor="middle">VALIDATED</text>
  </g>

  <!-- Editorial Subtext Stamp -->
  <text x="700" y="420" fill="#475569" font-family="monospace" font-size="10" text-anchor="end">FRINGE CODING · TAXONOMY EVALUATION</text>
</svg>
