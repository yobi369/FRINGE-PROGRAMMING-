<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="relBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C16"/>
      <stop offset="100%" stop-color="#0E172A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#relBg)"/>

  <g transform="translate(130, 80)">
    <!-- Circuit Breaker State Machine -->
    <rect x="0" y="40" width="150" height="120" rx="8" fill="#131F37" stroke="#10B981" stroke-width="2"/>
    <text x="75" y="85" fill="#34D399" font-family="sans-serif" font-weight="700" font-size="14" text-anchor="middle">CLOSED</text>
    <text x="75" y="110" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">Normal Traffic</text>
    <circle cx="75" cy="130" r="5" fill="#10B981"/>

    <!-- Path to Open -->
    <path d="M 150,100 L 220,100" stroke="#EF4444" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="185" y="90" fill="#F87171" font-family="monospace" font-size="9" text-anchor="middle">5 Errors</text>

    <!-- Open State -->
    <rect x="220" y="40" width="150" height="120" rx="8" fill="#1F1A24" stroke="#EF4444" stroke-width="2"/>
    <text x="295" y="85" fill="#F87171" font-family="sans-serif" font-weight="700" font-size="14" text-anchor="middle">OPEN</text>
    <text x="295" y="110" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">Fast Fallback</text>
    <circle cx="295" cy="130" r="5" fill="#EF4444"/>

    <!-- Path to Half Open -->
    <path d="M 370,100 L 440,100" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="405" y="90" fill="#FBBF24" font-family="monospace" font-size="9" text-anchor="middle">Cooldown</text>

    <!-- Half-Open State -->
    <rect x="440" y="40" width="150" height="120" rx="8" fill="#1B1F2A" stroke="#F59E0B" stroke-width="2"/>
    <text x="515" y="85" fill="#FBBF24" font-family="sans-serif" font-weight="700" font-size="14" text-anchor="middle">HALF-OPEN</text>
    <text x="515" y="110" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">Probe Request</text>
    <circle cx="515" cy="130" r="5" fill="#F59E0B"/>

    <!-- Recovery Loop back -->
    <path d="M 515,160 C 515,220 75,220 75,160" stroke="#10B981" stroke-width="1.5" stroke-dasharray="6,4" fill="none"/>
    <text x="295" y="215" fill="#34D399" font-family="monospace" font-size="10" text-anchor="middle">Success probe resets circuit to CLOSED</text>
  </g>
  <text x="700" y="420" fill="#475569" font-family="monospace" font-size="10" text-anchor="end">CIRCUIT BREAKER STATE MACHINE</text>
</svg>
