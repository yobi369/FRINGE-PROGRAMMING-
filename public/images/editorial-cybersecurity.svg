<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="secBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#secBg)"/>
  
  <g transform="translate(180, 80)">
    <!-- Security Shield Geometry -->
    <path d="M 220,20 L 360,70 L 360,190 C 360,250 220,300 220,300 C 220,300 80,250 80,190 L 80,70 Z" fill="#0B132B" stroke="#06B6D4" stroke-width="2"/>
    
    <!-- Inner Defense Layer -->
    <path d="M 220,50 L 330,90 L 330,180 C 330,230 220,270 220,270 C 220,270 110,230 110,180 L 110,90 Z" fill="#111B33" stroke="#8B5CF6" stroke-width="1.5"/>

    <!-- Key Lock Symbol -->
    <circle cx="220" cy="140" r="24" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <path d="M 215,145 L 225,145 L 228,185 L 212,185 Z" fill="#38BDF8"/>

    <!-- Threat Vectors (Deflected) -->
    <g stroke="#EF4444" stroke-width="2" stroke-dasharray="4,4">
      <line x1="20" y1="100" x2="70" y2="110"/>
      <line x1="20" y1="180" x2="70" y2="175"/>
      <line x1="420" y1="100" x2="370" y2="110"/>
      <line x1="420" y1="180" x2="370" y2="175"/>
    </g>
    <text x="35" y="90" fill="#EF4444" font-family="monospace" font-size="10">BLOCKED XSS</text>
    <text x="360" y="90" fill="#EF4444" font-family="monospace" font-size="10">BLOCKED INJECTION</text>
  </g>
  <text x="700" y="420" fill="#475569" font-family="monospace" font-size="10" text-anchor="end">DEFENSE-IN-DEPTH ARCHITECTURE</text>
</svg>
