<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="toolsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#toolsBg)"/>

  <!-- Benchmark Axes -->
  <g transform="translate(140, 70)">
    <!-- Main Card -->
    <rect x="0" y="0" width="520" height="290" rx="8" fill="#131B2E" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="40" fill="#38BDF8" font-family="sans-serif" font-weight="700" font-size="14">AI ASSISTANT BENCHMARK INDEX</text>
    <text x="30" y="60" fill="#64748B" font-family="monospace" font-size="11">ACCURACY VS. CONTEXT INDEXING DEPTH</text>

    <!-- Radar / Bar Visualization -->
    <!-- Cursor -->
    <text x="30" y="105" fill="#E2E8F0" font-family="monospace" font-size="12">CURSOR COMPOSER</text>
    <rect x="180" y="93" width="280" height="16" rx="4" fill="#06B6D4"/>
    <text x="470" y="106" fill="#38BDF8" font-family="monospace" font-size="11">94%</text>

    <!-- Copilot -->
    <text x="30" y="150" fill="#E2E8F0" font-family="monospace" font-size="12">GITHUB COPILOT</text>
    <rect x="180" y="138" width="220" height="16" rx="4" fill="#8B5CF6"/>
    <text x="410" y="151" fill="#C084FC" font-family="monospace" font-size="11">82%</text>

    <!-- Claude Code -->
    <text x="30" y="195" fill="#E2E8F0" font-family="monospace" font-size="12">CLAUDE CODE CLI</text>
    <rect x="180" y="183" width="260" height="16" rx="4" fill="#3B82F6"/>
    <text x="450" y="196" fill="#60A5FA" font-family="monospace" font-size="11">89%</text>

    <!-- Supermaven -->
    <text x="30" y="240" fill="#E2E8F0" font-family="monospace" font-size="12">SUPERMAVEN LATENCY</text>
    <rect x="180" y="228" width="300" height="16" rx="4" fill="#10B981"/>
    <text x="490" y="241" fill="#34D399" font-family="monospace" font-size="11">&lt;100ms</text>
  </g>
  <text x="700" y="420" fill="#475569" font-family="monospace" font-size="10" text-anchor="end">BENCHMARKING &amp; DEVELOPER TOOLING</text>
</svg>
